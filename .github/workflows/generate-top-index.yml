name: Generate top _index.md

on:
  push:
    paths:
      - 'MaintenanceNote/**'
      - 'scripts/generate_index.py'
    paths-ignore:
      - 'MaintenanceNote/_index.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate index
        run: python scripts/generate_index.py --root MaintenanceNote --top-n 8

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add MaintenanceNote/_index.md
            git commit -m "chore: auto-generate top index [skip ci]"
            git pull --rebase
            git push
          else
            echo "No changes to commit"
          fi
