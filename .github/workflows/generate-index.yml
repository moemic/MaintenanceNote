name: Generate Maintenance Index

on:
  push:
    paths:
      - 'MaintenanceNote/**'
      - '**/*.md'
      - '**/assets/**'
    paths-ignore:
      - 'MaintenanceNote/_index.md'
      - '_index.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate index
        run: python scripts/generate_index.py --top-n 10

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(index): regenerate _index.md [skip ci]"
            git pull --rebase
            git push
          else
            echo "No changes to commit"
          fi
